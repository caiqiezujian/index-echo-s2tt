name: CPU contracts
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[dev]'
      - run: ruff check run_s2tt.py src tests
      - run: bash -n deploy/start_server.sh deploy/start_web.sh
      - run: pytest -m 'not real_model' --junitxml=cpu-contracts.xml
